name: Deploy to Vercel (production)

# Deploys to Vercel on every push to frontend/dev using a Vercel token in CI.
# This decouples deployments from Vercel team membership, so ANY committer's
# push deploys without each person needing a paid Vercel seat. The native Vercel
# Git integration is disabled for this branch in vercel.json to avoid double-deploys.
#
# The build MUST run on Vercel's builders (`vercel deploy`, not `vercel build`
# + `--prebuilt`): this project's env vars are marked Sensitive, so `vercel pull`
# outside Vercel writes literal "[SENSITIVE]" placeholders instead of values —
# a local build then inlines those into the client bundle and the app crashes
# on load (blank screen; this shipped on 2026-07-21). Sensitive values only
# decrypt on Vercel's own infrastructure.

on:
  push:
    branches:
      - frontend/dev
  workflow_dispatch: {}

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Remote build: uploads source and builds on Vercel, where Sensitive env
      # vars decrypt. VERCEL_ORG_ID + VERCEL_PROJECT_ID (job env) select the
      # project, so no `vercel pull`/link step is needed.
      - name: Deploy to production (build runs on Vercel)
        run: vercel deploy --prod --token="$VERCEL_TOKEN"
