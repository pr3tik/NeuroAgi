name: Deploy to Vercel (production)

# Deploys to Vercel on every push to frontend/dev using a Vercel token in CI.
# This decouples deployments from Vercel team membership, so ANY committer's
# push deploys without each person needing a paid Vercel seat. The native Vercel
# Git integration is disabled for this branch in vercel.json to avoid double-deploys.

on:
  push:
    branches:
      - frontend/dev
  workflow_dispatch: {}

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifacts to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
